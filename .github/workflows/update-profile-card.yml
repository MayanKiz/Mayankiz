name: Update GitHub Profile Card

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-card
  cancel-in-progress: false

jobs:
  update-profile-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refresh profile card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile_card.py

      - name: Commit updated cards
        run: |
          if git diff --quiet -- dark_mode-1.svg light_mode.svg; then
            echo "Profile cards are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode-1.svg light_mode.svg
          git commit -m "chore: refresh GitHub profile card"
          git push
