# gh-ascii — refresh profile cards every 3 hours
#
# Re-downloads both themes and commits only when a card changes.
# GitHub scheduled workflows can be delayed and may be disabled after
# 60 days of repository inactivity.

name: Refresh gh-ascii card

on:
  schedule:
    # Every 3 hours (UTC), at minute 17.
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-gh-ascii-card
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download both themes
        env:
          HANDLE: MayanKiz
          GH_ASCII_URL: https://gh.crafter.run
          # Optional: ASCII resolution, 40-160 (default 100).
          # COLS: "120"
        run: |
          curl -fsSL --retry 3 --retry-delay 5 \
            "$GH_ASCII_URL/$HANDLE?theme=dark${COLS:+&cols=$COLS}" \
            -o dark_mode-1.svg
          curl -fsSL --retry 3 --retry-delay 5 \
            "$GH_ASCII_URL/$HANDLE?theme=light${COLS:+&cols=$COLS}" \
            -o light_mode.svg

      - name: Commit only if the card changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode-1.svg light_mode.svg
          if git diff --cached --quiet; then
            echo "Card unchanged — nothing to commit."
          else
            git commit -m "chore: refresh gh-ascii profile cards"
            git push
          fi
